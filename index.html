<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandala avec clé royale</title>
<style>
  :root { --teal: #1aa5b0; --white: #fff; }
  html, body { margin: 0; height: 100%; background: var(--white); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

  #m {
    width: 104vw; height: 104vw; max-width: none; flex: none; display: block;
    position: relative; z-index: 1;
  }

  /* ---------- CONTENEUR DE LA CLÉ (centré sur le mandala) ---------- */
  #floatingKey {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: 50%;
    width: clamp(130px, 34vw, 260px);
    transform: translate(-50%, -50%);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    filter: drop-shadow(0 0 14px #e8c878cc) drop-shadow(0 0 40px #a66de388) drop-shadow(0 0 70px #7d3fc455);
    animation: keyDrift 4.2s ease-in-out infinite;
    pointer-events: auto;
    will-change: left, top, transform;
    transition: left 0.25s cubic-bezier(.2,.9,.3,1.2), top 0.25s cubic-bezier(.2,.9,.3,1.2);
  }
  #floatingKey svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* ---------- HALO PERMANENT AUTOUR DE LA CLÉ ---------- */
  #floatingKey::before {
    content: "";
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 230, 140, 0.45) 0%, rgba(200, 140, 255, 0.25) 35%, transparent 70%);
    z-index: -1;
    animation: haloPulse 2.6s ease-in-out infinite alternate;
    pointer-events: none;
    filter: blur(6px);
  }
  @keyframes haloPulse {
    from { opacity: .55; transform: scale(.92); }
    to   { opacity: 1;   transform: scale(1.12); }
  }

  /* ---------- PARTICULES MAGIQUES ---------- */
  #magicParticles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 9;
    pointer-events: none;
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes keyDrift {
    0%, 100% { transform: translate(-50%, -50%) rotate(-8deg); }
    50%      { transform: translate(-50%, -50%) rotate(3deg); }
  }
  #floatingKey .key-glint {
    animation: keyGlint .85s ease-in-out infinite alternate;
  }
  @keyframes keyGlint { from { opacity: .35; } to { opacity: 1; } }

  /* ---------- COMPTE À REBOURS ---------- */
  .countdown-wrap {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom, 18px));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 20px;
    border-radius: 40px;
    background: rgba(8, 4, 17, 0.78);
    border: 1px solid rgba(232, 200, 120, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(166, 109, 227, 0.25), inset 0 0 12px rgba(232, 200, 120, 0.1);
    color: #f5dfb2;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(0.85rem, 3.2vw, 1.15rem);
    letter-spacing: 0.04em;
    text-shadow: 0 0 8px rgba(201, 160, 255, 0.5);
    animation: countdownGlow 3s ease-in-out infinite alternate;
    pointer-events: none;
    white-space: nowrap;
  }
  @keyframes countdownGlow {
    from { box-shadow: 0 0 20px rgba(166, 109, 227, 0.2), inset 0 0 8px rgba(232, 200, 120, 0.08); }
    to   { box-shadow: 0 0 35px rgba(166, 109, 227, 0.4), inset 0 0 15px rgba(232, 200, 120, 0.2); }
  }

  /* Unité "jours" avec la feuille qui cache le nombre */
  .days-unit {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-right: 4px;
  }
  .days-hidden {
    display: inline-block;
    min-width: 1.6em;
    text-align: center;
    visibility: hidden;
  }
  /* Feuille blanche suspendue qui cache le nombre */
  .paper-overlay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -55%) rotate(-4deg);
    width: 2.2em;
    height: 2.4em;
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  .paper-overlay svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  /* Léger balancement de la feuille */
  .paper-overlay {
    animation: paperSway 3.5s ease-in-out infinite;
    transform-origin: 50% 0%;
  }
  @keyframes paperSway {
    0%, 100% { transform: translate(-50%, -55%) rotate(-4deg); }
    50%      { transform: translate(-50%, -55%) rotate(5deg); }
  }

  .countdown-number {
    display: inline-block;
    min-width: 1.4em;
    text-align: center;
    font-weight: 700;
    color: #fff0c8;
  }

  /* ---------- HINT DE DÉPLACEMENT ---------- */
  .drag-hint {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: 68px;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 30px;
    color: #f0d9a0;
    font-size: 12px;
    letter-spacing: .05em;
    background: #13091ed9;
    border: 1px solid #d6b76b66;
    backdrop-filter: blur(8px);
    pointer-events: none;
    animation: hintFade 6s ease 2s forwards;
    white-space: nowrap;
  }
  @keyframes hintFade { to { opacity: 0; visibility: hidden; } }

  @media (max-width: 420px) {
    #floatingKey { width: clamp(110px, 30vw, 180px); }
    .drag-hint { font-size: 10px; padding: 6px 10px; bottom: 60px; }
    .countdown-wrap { padding: 8px 14px; gap: 3px; }
    .paper-overlay { width: 2em; height: 2.2em; }
  }
</style>
</head>
<body>

<!-- ===================== MANDALA ===================== -->
<svg id="m" viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
const T = getComputedStyle(document.documentElement).getPropertyValue('--teal').trim() || '#1aa5b0';
const W = '#fff';
const svg = document.getElementById('m');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const circle = (r, fill, stroke, sw) => el('circle', { cx: 0, cy: 0, r, fill: fill || 'none', stroke: stroke || 'none', 'stroke-width': sw || 0 });
const petal = (r1, r2, w) => `M0 ${-r1} Q ${w} ${-(r1 + r2) / 2} 0 ${-r2} Q ${-w} ${-(r1 + r2) / 2} 0 ${-r1} Z`;
const tri = (r1, r2, w) => `M ${-w} ${-r1} L 0 ${-r2} L ${w} ${-r1} Z`;

function ring(n, offset, fn) {
  for (let i = 0; i < n; i++) {
    const g = el('g', { transform: `rotate(${(360 / n) * i + offset})` });
    fn(g);
  }
}
const path = (g, d, fill, stroke, sw) => el('path', { d, fill, stroke: stroke || 'none', 'stroke-width': sw || 0, 'stroke-linejoin': 'round' }, g);
const dot = (g, r, rad, fill) => el('circle', { cx: 0, cy: -r, r: rad, fill }, g);

circle(286, T);
ring(90, 0, g => dot(g, 288, 6, T));
ring(90, 0, g => dot(g, 284, 1.6, W));

circle(278, 'none', W, 3);
circle(271, 'none', W, 1.6);
ring(180, 0, g => dot(g, 275, 0.9, W));

ring(36, 5, g => {
  path(g, tri(232, 270, 6), W);
  path(g, tri(240, 262, 2.6), T);
  el('path', { d: 'M -8 -252 A 8 8 0 0 1 8 -252', fill: 'none', stroke: W, 'stroke-width': 2.4 }, g);
  dot(g, 262, 2, W); dot(g, 255, 1.6, W);
  el('circle', { cx: -9, cy: -250, r: 1.6, fill: W }, g);
  el('circle', { cx: 9, cy: -250, r: 1.6, fill: W }, g);
});

ring(36, 0, g => {
  path(g, petal(204, 266, 16), T, W, 3.2);
  path(g, petal(212, 255, 10), W);
  path(g, petal(220, 248, 5.5), T);
  path(g, petal(226, 242, 2.4), W);
  dot(g, 200, 2.6, W);
  dot(g, 258, 1.5, T);
});

circle(198, 'none', W, 3);
ring(72, 0, g => path(g, tri(190, 199, 4.5), W));
ring(72, 2.5, g => path(g, tri(190, 183, 3), W));
ring(120, 0, g => dot(g, 178, 1.8, W));
circle(172, 'none', W, 2);
ring(120, 1.5, g => dot(g, 167, 1.4, W));
circle(162, 'none', W, 1.4);

ring(16, 11.25, g => {
  path(g, petal(124, 182, 15), W);
  path(g, petal(134, 174, 8), T);
  path(g, petal(142, 166, 3.2), W);
  dot(g, 118, 2.4, W);
});

ring(16, 0, g => {
  path(g, petal(102, 170, 34), T, W, 4);
  path(g, petal(110, 160, 25), W);
  path(g, petal(116, 152, 17), T);
  path(g, petal(122, 144, 9), W);
  path(g, petal(128, 138, 3.4), T);
  [150, 156, 162].forEach(r => dot(g, r, 1.6, W));
  [-14, 14].forEach(x => el('circle', { cx: x, cy: -136, r: 1.7, fill: W }, g));
  dot(g, 98, 3.4, W);
});

circle(98, 'none', W, 3);
ring(72, 0, g => dot(g, 92, 2.2, W));
circle(86, 'none', W, 2);
ring(144, 0, g => dot(g, 82, 1.4, W));

ring(48, 0, g => path(g, tri(66, 79, 4.5), W));
ring(48, 3.75, g => path(g, tri(66, 72, 2.5), W));
circle(64, 'none', W, 3);
ring(96, 0, g => dot(g, 59, 1.5, W));
circle(54, 'none', W, 1.6);

ring(16, 0, g => {
  path(g, petal(20, 52, 12), T, W, 2.4);
  path(g, petal(26, 45, 5.5), W);
  dot(g, 49, 1.3, T);
});
ring(16, 11.25, g => path(g, petal(18, 36, 6), T, W, 1.8));
ring(32, 0, g => dot(g, 30, 1.2, W));
circle(21, T, W, 4);
circle(14, 'none', W, 1.4);
circle(10, W);
circle(5, T);

<!-- ===================== SCRIPT CLÉ + PARTICULES + COMPTE À REBOURS ===================== -->
<script>
(() => {
  // ==================== COMPTE À REBOURS 24H PERSISTANT ====================
  const COUNTDOWN_KEY = 'roxane_countdown_start_v1';
  const CYCLE_MS = 24 * 60 * 60 * 1000; // 24 heures en millisecondes

  let cycleStart = Number(localStorage.getItem(COUNTDOWN_KEY));

  // Point de départ visuel initial : 13h 25min 7s écoulées sur 24h
  const INITIAL_ELAPSED_MS = (13 * 3600 + 25 * 60 + 7) * 1000;

  if (!Number.isFinite(cycleStart) || cycleStart <= 0) {
    cycleStart = Date.now() - INITIAL_ELAPSED_MS;
    localStorage.setItem(COUNTDOWN_KEY, String(cycleStart));
  }

  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');

  function updateCountdown() {
    const now = Date.now();
    let elapsed = now - cycleStart;

    // Si le cycle de 24h est terminé, on le réinitialise à 0
    if (elapsed >= CYCLE_MS) {
      // On avance d'autant de cycles complets que nécessaire
      const cyclesPassed = Math.floor(elapsed / CYCLE_MS);
      cycleStart += cyclesPassed * CYCLE_MS;
      localStorage.setItem(COUNTDOWN_KEY, String(cycleStart));
      elapsed = now - cycleStart;
    }

    const totalSeconds = Math.floor(elapsed / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    hoursEl.textContent = String(hours).padStart(2, '0');
    minutesEl.textContent = String(minutes).padStart(2, '0');
    secondsEl.textContent = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ==================== CLÉ QUI SE TÉLÉPORTE AU TOUCHER ====================
  const floatingKey = document.getElementById('floatingKey');
  const dragHint = document.getElementById('dragHint');

  function moveKeyTo(clientX, clientY) {
    const keyW = floatingKey.offsetWidth;
    const keyH = floatingKey.offsetHeight;
    let x = clientX - keyW / 2;
    let y = clientY - keyH / 2;

    // Contraintes pour rester dans l'écran
    x = Math.max(0, Math.min(innerWidth - keyW, x));
    y = Math.max(0, Math.min(innerHeight - keyH, y));

    // On désactive l'animation pour éviter les conflits
    floatingKey.style.animation = 'none';

    // Positionnement absolu (la clé se téléporte)
    floatingKey.style.left = x + 'px';
    floatingKey.style.top = y + 'px';
    floatingKey.style.transform = 'none';

    // On réactive l'animation de flottement autour de la nouvelle position
    // (on force un reflow pour que l'animation reparte)
    void floatingKey.offsetWidth;
    floatingKey.style.animation = 'keyDrift 4.2s ease-in-out infinite';
    // Mais on doit garder la position via left/top, donc on adapte l'animation
    // On va plutôt utiliser une animation qui ne touche pas à left/top
  }

  // Gestion du clic / toucher sur l'écran
  let isMoving = false;

  floatingKey.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    isMoving = true;
    floatingKey.setPointerCapture(e.pointerId);
    moveKeyTo(e.clientX, e.clientY);
    dragHint.style.opacity = '0';
  });

  floatingKey.addEventListener('pointermove', (e) => {
    if (!isMoving) return;
    e.preventDefault();
    moveKeyTo(e.clientX, e.clientY);
  });

  function stopMoving() {
    isMoving = false;
  }
  floatingKey.addEventListener('pointerup', stopMoving);
  floatingKey.addEventListener('pointercancel', stopMoving);

  // Également permettre de toucher n'importe où sur l'écran pour déplacer la clé
  // (optionnel, mais plus pratique pour "téléporter")
  document.addEventListener('pointerdown', (e) => {
    // Si on touche la clé elle-même, le handler précédent s'en occupe
    if (e.target.closest('#floatingKey')) return;
    // Si on touche le compte à rebours ou le hint, on ignore
    if (e.target.closest('.countdown-wrap') || e.target.closest('.drag-hint')) return;

    moveKeyTo(e.clientX, e.clientY);
    dragHint.style.opacity = '0';
  });

  // ==================== PARTICULES MAGIQUES QUI SORTENT DE LA CLÉ ====================
  const canvas = document.getElementById('magicParticles');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  let sparkles = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const COLORS = [
    '#FFE066', '#FFD700', '#FFF0B0', '#E8C878',
    '#C9A0FF', '#A66DE3', '#B78AEF', '#FFFFFF'
  ];

  function createSparkle() {
    const rect = floatingKey.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    const angle = Math.random() * Math.PI * 2;
    const dist0 = (rect.width / 2) * (0.6 + Math.random() * 0.6);

    return {
      x: cx + Math.cos(angle) * dist0,
      y: cy + Math.sin(angle) * dist0,
      vx: Math.cos(angle) * (0.5 + Math.random() * 1.6),
      vy: Math.sin(angle) * (0.5 + Math.random() * 1.6) - 0.4,
      life: 1,
      decay: 0.008 + Math.random() * 0.018,
      size: 1.2 + Math.random() * 3.2,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      twinkle: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.08
    };
  }

  setInterval(() => {
    const count = 3 + Math.floor(Math.random() * 6);
    for (let i = 0; i < count; i++) {
      if (sparkles.length < 350) {
        sparkles.push(createSparkle());
      }
    }
  }, 55);

  function drawSparkles(t) {
    ctx.clearRect(0, 0, w, h);

    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.012;
      s.vx *= 0.995;
      s.vy *= 0.995;
      s.life -= s.decay;
      s.rot += s.rotSpeed;
      s.twinkle += 0.08;

      if (s.life <= 0) {
        sparkles.splice(i, 1);
        continue;
      }

      const alpha = s.life * (0.6 + 0.4 * Math.sin(s.twinkle));
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = 18;
      ctx.shadowColor = s.color;

      const sz = s.size * (0.8 + 0.4 * Math.sin(s.twinkle));
      ctx.fillStyle = s.color;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = (k * Math.PI) / 2;
        const outerX = Math.cos(a) * sz;
        const outerY = Math.sin(a) * sz;
        const innerX = Math.cos(a + Math.PI / 4) * sz * 0.35;
        const innerY = Math.sin(a + Math.PI / 4) * sz * 0.35;
        if (k === 0) ctx.moveTo(outerX, outerY);
        else ctx.lineTo(outerX, outerY);
        ctx.lineTo(innerX, innerY);
      }
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 24;
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = alpha * 0.85;
      ctx.beginPath();
      ctx.arc(0, 0, sz * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(drawSparkles);
  }

  requestAnimationFrame(drawSparkles);
})();
</script>
