<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091f">
<title>Roxane 😂✨</title>
<style>
  :root { --pink:#ff4fb8; --violet:#9b5cff; --cyan:#6ef6ff; --gold:#ffe49b; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    min-height:100svh; overflow:hidden; display:grid; place-items:center;
    color:#fff; font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 18% 18%, #52256c 0, transparent 36%),
      radial-gradient(ellipse at 85% 80%, #153d67 0, transparent 40%),
      linear-gradient(145deg,#090615 0%,#1c0d32 52%,#080d20 100%);
    isolation:isolate;
  }
  body::before, body::after {
    content:""; position:fixed; inset:-30%; z-index:-2; pointer-events:none;
    background:conic-gradient(from 0deg,transparent 0 20%,#ff4fb81b 26%,transparent 33% 48%,#6ef6ff18 55%,transparent 63% 80%,#9b5cff24 87%,transparent 94%);
    filter:blur(45px); animation:rotateGlow 22s linear infinite;
  }
  body::after { animation-direction:reverse; animation-duration:31s; opacity:.7; transform:scale(.8); }
  @keyframes rotateGlow { to { transform:rotate(360deg); } }
  #particles { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  .aurora { position:fixed; width:65vw; height:65vw; max-width:650px; max-height:650px; border-radius:50%; filter:blur(65px); opacity:.19; z-index:-1; animation:float 8s ease-in-out infinite alternate; }
  .aurora.a { background:var(--pink); top:-28%; left:-25%; }
  .aurora.b { background:#3b9dff; bottom:-35%; right:-25%; animation-delay:-4s; }
  @keyframes float { to { transform:translate(12vw,8vh) scale(1.2); } }
  main { width:100%; padding:24px 18px; display:grid; place-items:center; min-height:100svh; }
  .card {
    position:relative; width:min(100%,650px); padding:clamp(28px,7vw,56px) clamp(20px,6vw,46px);
    text-align:center; border-radius:30px;
    background:linear-gradient(135deg,#ffffff15,#ffffff06);
    border:1px solid #ffffff35; box-shadow:0 0 45px #b04cff24, inset 0 0 30px #ffffff08;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    animation:cardEnter 1s cubic-bezier(.2,.8,.2,1) both, cardFloat 5s ease-in-out 1s infinite;
  }
  .card::before { content:""; position:absolute; inset:-2px; border-radius:32px; padding:2px;
    background:linear-gradient(120deg,var(--pink),transparent 35%,var(--cyan),transparent 70%,var(--gold));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    pointer-events:none; opacity:.8; }
  @keyframes cardEnter { from { opacity:0; transform:translateY(35px) scale(.92) rotateX(8deg); } to { opacity:1; transform:translateY(0) scale(1) rotateX(0); } }
  @keyframes cardFloat { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:8px 13px; margin-bottom:24px;
    border:1px solid #ffffff35; border-radius:999px; color:#ffe7fb; background:#ffffff0c;
    font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; }
  .spark { display:inline-block; animation:twinkle .55s ease-in-out infinite alternate; }
  @keyframes twinkle { to { transform:rotate(35deg) scale(1.35); filter:drop-shadow(0 0 7px white); } }
  h1 { margin:0; font-weight:900; font-size:clamp(2rem,8.5vw,4.45rem); line-height:1.14; letter-spacing:-.055em; text-wrap:balance; }
  .line { display:block; }
  .gradient { color:transparent; background:linear-gradient(90deg,#fff 0%,#ffb6e8 30%,#a8faff 65%,#ffe9a8 100%); background-size:220% auto;
    -webkit-background-clip:text; background-clip:text; animation:shine 1.15s linear infinite; }
  @keyframes shine { to { background-position:220% center; } }
  .name { display:inline-block; color:#fff; text-shadow:0 0 12px #ff4fb8,0 0 32px #ff4fb86e; animation:namePulse .72s ease-in-out infinite; }
  @keyframes namePulse { 50% { text-shadow:0 0 20px #ff4fb8,0 0 48px #ff4fb8a8; transform:scale(1.035); } }
  .emoji-row { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin:27px 0 22px; font-size:clamp(1.8rem,7vw,3rem); }
  .emoji-row span { display:inline-block; filter:drop-shadow(0 0 9px #ffffff30); animation:emojiBounce 1.3s ease-in-out infinite; }
  .emoji-row span:nth-child(2n) { animation-delay:-.3s; }
  .emoji-row span:nth-child(3n) { animation-delay:-.65s; }
  @keyframes emojiBounce { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(-10px) rotate(8deg); } }
  .sub { color:#e9ddf7; font-size:.95rem; margin:0; opacity:.86; }
  .button { margin-top:25px; border:1px solid #ffffff55; color:#fff; background:linear-gradient(100deg,#ff4fb8,#895bff 60%,#31c9ed);
    border-radius:999px; padding:13px 21px; font:700 1rem inherit; font-family:inherit; cursor:pointer;
    box-shadow:0 8px 28px #a33cff44; transition:transform .2s,filter .2s; -webkit-tap-highlight-color:transparent; }
  .button:active { transform:scale(.96); filter:brightness(1.2); }
  .button:hover { transform:translateY(-2px); filter:brightness(1.12); }
  .footer { position:fixed; bottom:max(12px,env(safe-area-inset-bottom)); left:0; right:0; text-align:center; color:#d7c8e8a8; font-size:.72rem; letter-spacing:.08em; }
  .burst { position:fixed; z-index:5; pointer-events:none; font-size:24px; animation:burst 1.2s ease-out forwards; }
  @keyframes burst { 0% { opacity:1; transform:translate(0,0) scale(.5) rotate(0); } 100% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(var(--rot)); } }

  /* Grande clé royale flottante, déplaçable au doigt ou à la souris */
  #floatingKey {
    position:fixed; z-index:2; left:4%; top:13%; width:clamp(112px,31vw,205px);
    cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
    filter:drop-shadow(0 0 10px #ffe49b88) drop-shadow(0 0 26px #ffbf4a55);
    opacity:.88; animation:keyDrift 4.2s ease-in-out infinite;
  }
  #floatingKey:active { cursor:grabbing; }
  #floatingKey svg { display:block; width:100%; height:auto; overflow:visible; }
  #floatingKey .key-glint { animation:keyGlint .85s ease-in-out infinite alternate; }
  @keyframes keyDrift { 0%,100% { transform:translateY(0) rotate(-8deg); } 50% { transform:translateY(-18px) rotate(3deg); } }
  @keyframes keyGlint { from { opacity:.35; } to { opacity:1; } }
  .drag-hint { position:fixed; z-index:2; left:12px; bottom:34px; padding:7px 10px; border-radius:20px;
    color:#f9eaff; font-size:11px; letter-spacing:.04em; background:#ffffff12; border:1px solid #ffffff30;
    backdrop-filter:blur(8px); pointer-events:none; animation:hintFade 5s ease 2s forwards; }
  @keyframes hintFade { to { opacity:0; } }
  @media (max-width:420px) { #floatingKey { width:clamp(100px,29vw,145px); left:2%; top:10%; } }

  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>

<aside id="floatingKey" aria-label="Clé royale décorative déplaçable" title="Déplace-moi !" tabindex="0">
  <svg viewBox="0 0 100 240" role="img" aria-label="Grande clé dorée ornée">
    <defs>
      <linearGradient id="keyGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b2"/><stop offset=".25" stop-color="#f1d27a"/><stop offset=".55" stop-color="#b8862f"/><stop offset=".8" stop-color="#ffe8a0"/><stop offset="1" stop-color="#6e4a14"/></linearGradient>
      <radialGradient id="keyGem"><stop offset="0" stop-color="#fff9d9"/><stop offset=".45" stop-color="#ffcf67"/><stop offset="1" stop-color="#9b5cff"/></radialGradient>
    </defs>
    <g fill="none" stroke="url(#keyGold)" stroke-width="5">
      <circle cx="50" cy="39" r="28"/><circle cx="50" cy="39" r="19" stroke-width="2"/>
      <path d="M50 11V5M50 67V73M22 39H16M78 39H84" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g fill="url(#keyGold)" stroke="#fff0ad" stroke-width=".7">
      <path d="M50 19C60 29 58 42 50 53C42 42 40 29 50 19Z"/>
      <path d="M46 48C37 39 26 42 25 51C25 60 35 62 46 56Z"/>
      <path d="M54 48C63 39 74 42 75 51C75 60 65 62 54 56Z"/>
      <circle cx="50" cy="39" r="5" fill="url(#keyGem)"/>
      <path d="M36 70H64L68 80H32Z"/><rect x="39" y="79" width="22" height="8" rx="2"/>
      <rect x="45" y="85" width="10" height="126" rx="4"/>
      <path d="M42 111H58V118H42ZM42 146H58V153H42Z"/>
      <path d="M54 174H79V184H68V193H80V203H68V212H80V223H54Z"/>
      <path class="key-glint" d="M48 91V166" fill="none" stroke="#fff7d0" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <g fill="#fff0b0"><circle cx="18" cy="20" r="2"/><circle cx="82" cy="64" r="1.8"/><path d="M83 104l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>
  </svg>
</aside>
<div class="drag-hint" id="dragHint">✦ Déplace la clé avec ton doigt ✦</div>

<canvas id="particles" aria-hidden="true"></canvas>
<div class="aurora a"></div><div class="aurora b"></div>
<main>
  <section class="card" aria-label="Message pour Roxane">
    <div class="eyebrow"><span class="spark">✦</span> Autorisation officielle <span class="spark">✦</span></div>
    <h1>
      <span class="line">Bien sûr que</span>
      <span class="line gradient">tu peux poster</span>
      <span class="line">dans ta story</span>
      <span class="line name">Roxane 😂</span>
    </h1>
    <div class="emoji-row" aria-label="Émojis de rire et de larmes">
      <span>😂</span><span>😂</span><span>😂</span><span>😂</span><span>😭</span><span>😭</span><span>😭</span>
    </div>
    <p class="sub">Décision validée à l’unanimité. Aucun recours possible. ✨</p>
    <button class="button" id="celebrate" type="button">Appuie pour célébrer ✨</button>
  </section>
</main>
<div class="footer">DÉCRET ROYAL • STORY APPROUVÉE 👑</div>
<script>
(() => {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, particles = [];
  const colors = ['#ff73c8','#8f7cff','#75f5ff','#ffe49b','#ffffff'];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    particles = Array.from({length: Math.min(100, Math.floor(w*h/9500))}, () => makeParticle(true));
  }
  function makeParticle(randomY=false) {
    return {x:Math.random()*w,y:randomY?Math.random()*h:h+10,r:Math.random()*2.3+.5,
      speed:Math.random()*.55+.15, drift:(Math.random()-.5)*.45, alpha:Math.random()*.65+.2,
      color:colors[Math.floor(Math.random()*colors.length)], phase:Math.random()*Math.PI*2};
  }
  function draw(t) {
    ctx.clearRect(0,0,w,h);
    particles.forEach(p => {
      p.y -= p.speed; p.x += p.drift + Math.sin(t*.0008+p.phase)*.25;
      if(p.y < -10) { p.y=h+10; p.x=Math.random()*w; }
      if(p.x < -10) p.x=w+10; if(p.x>w+10) p.x=-10;
      ctx.globalAlpha=p.alpha*(.65+.35*Math.sin(t*.002+p.phase));
      ctx.fillStyle=p.color; ctx.shadowBlur=12; ctx.shadowColor=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      if(p.r>1.8) { ctx.globalAlpha*=.5; ctx.fillRect(p.x-5,p.y-.4,10,.8); ctx.fillRect(p.x-.4,p.y-5,.8,10); }
    });
    ctx.globalAlpha=1; ctx.shadowBlur=0; requestAnimationFrame(draw);
  }
  resize(); requestAnimationFrame(draw); addEventListener('resize',resize);
  function burst(x,y) {
    const emojis=['✨','😂','💖','😭','👑','💫','🎉'];
    for(let i=0;i<34;i++) {
      const el=document.createElement('span'); el.className='burst';
      el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left=x+'px'; el.style.top=y+'px';
      const angle=Math.random()*Math.PI*2, dist=70+Math.random()*180;
      el.style.setProperty('--dx',Math.cos(angle)*dist+'px');
      el.style.setProperty('--dy',Math.sin(angle)*dist+'px');
      el.style.setProperty('--rot',(Math.random()*500-250)+'deg');
      document.body.appendChild(el); setTimeout(()=>el.remove(),1300);
    }
  }
  document.getElementById('celebrate').addEventListener('click', e => {
    const r=e.currentTarget.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2);
  });
  document.querySelector('.card').addEventListener('click', e => {
    if(e.target.closest('button')) return;
    burst(e.clientX,e.clientY);
  });
  setTimeout(()=>burst(innerWidth/2,innerHeight/2),650);

  // Clé royale librement déplaçable (souris et écran tactile)
  const floatingKey = document.getElementById('floatingKey');
  const dragHint = document.getElementById('dragHint');
  let keyDragging = false, keyMoved = false, keyPointerX = 0, keyPointerY = 0, keyLeft = 0, keyTop = 0;
  floatingKey.addEventListener('pointerdown', (e) => {
    keyDragging = true; keyMoved = false;
    const r = floatingKey.getBoundingClientRect();
    keyPointerX = e.clientX; keyPointerY = e.clientY; keyLeft = r.left; keyTop = r.top;
    floatingKey.style.animation = 'none';
    floatingKey.style.left = r.left + 'px'; floatingKey.style.top = r.top + 'px';
    floatingKey.style.right = 'auto'; floatingKey.style.bottom = 'auto';
    floatingKey.setPointerCapture(e.pointerId); e.preventDefault();
    dragHint.style.opacity = '0';
  });
  floatingKey.addEventListener('pointermove', (e) => {
    if (!keyDragging) return;
    const dx = e.clientX-keyPointerX, dy = e.clientY-keyPointerY;
    if (Math.abs(dx)+Math.abs(dy)>3) keyMoved = true;
    const maxX = Math.max(0, innerWidth-floatingKey.offsetWidth), maxY = Math.max(0, innerHeight-floatingKey.offsetHeight);
    floatingKey.style.left = Math.max(0,Math.min(maxX,keyLeft+dx))+'px';
    floatingKey.style.top = Math.max(0,Math.min(maxY,keyTop+dy))+'px';
  });
  function releaseKey(){ if(!keyDragging) return; keyDragging=false; if(keyMoved) floatingKey.style.animation='keyDrift 4.2s ease-in-out infinite'; }
  floatingKey.addEventListener('pointerup',releaseKey);
  floatingKey.addEventListener('pointercancel',releaseKey);
  floatingKey.addEventListener('keydown',e=>{ const step=e.shiftKey?24:10; let x=parseFloat(floatingKey.style.left)||floatingKey.getBoundingClientRect().left; let y=parseFloat(floatingKey.style.top)||floatingKey.getBoundingClientRect().top; if(e.key==='ArrowLeft')x-=step;else if(e.key==='ArrowRight')x+=step;else if(e.key==='ArrowUp')y-=step;else if(e.key==='ArrowDown')y+=step;else return; e.preventDefault(); floatingKey.style.animation='none'; floatingKey.style.left=Math.max(0,Math.min(innerWidth-floatingKey.offsetWidth,x))+'px'; floatingKey.style.top=Math.max(0,Math.min(innerHeight-floatingKey.offsetHeight,y))+'px'; floatingKey.style.right='auto'; });
})();
</script>
</body>
</html>
